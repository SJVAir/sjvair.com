# Listings matched by CDPR's chemical name (a regex over it), for entries a
# CAS number can't cover:
# - "salts and esters": CDPR names each one for the parent ("2,4-D,
#   DIMETHYLAMINE SALT").
# - "all isomers": CDPR's BHC, alpha-, beta- and delta-BHC are lindane's.
# - "compounds": CARB's note, "any unique chemical substance that contains
#   the named chemical ... as part of that chemical's infrastructure". The
#   name is the only structure on hand, so keep the patterns tight
#   (CHROMOBACTERIUM and CHROMAFENOZIDE aren't chromium) and name the
#   ingredients whose names hide the element: MANCOZEB and MANEB are
#   manganese ethylenebisdithiocarbamates.
# - "glycol ethers": mono- and di-ethers of ethylene, diethylene and
#   triethylene glycol; polymers are excluded, and so are the herbicides'
#   butoxyethanol esters (an ester, not the ether).
# Polycyclic organic matter, fine mineral fibers, coke oven emissions and
# radionuclides are defined by structure or source, so nothing matches them.
by_name:
  - {name: "2,4-D, salts and esters", pattern: "^2,4-D,"}
  - {name: "4,6-Dinitro-o-cresol, and salts", pattern: "^4,6-DINITRO-O-CRESOL,"}
  - {name: "Lindane (all isomers)", pattern: "\\bBHC\\b|HEXACHLOROCYCLOHEXANE"}
  - {name: "Antimony compounds", pattern: "ANTIMON"}
  - {name: "Arsenic compounds (inorganic including arsine)", pattern: "ARSEN(IC|ATE|ITE|IDE)"}
  - {name: "Beryllium compounds", pattern: "BERYLL"}
  - {name: "Cadmium compounds", pattern: "CADMIUM"}
  - {name: "Chromium compounds", pattern: "CHROMI(C|UM)|CHROMATE"}
  - {name: "Cobalt compounds", pattern: "COBALT"}
  - {name: "Cyanide compounds", pattern: "CYANIDE"}
  - {name: "Glycol ethers", pattern: "^(DI|TRI)?ETHYLENE GLYCOL (MONO|DI)[A-Z]* ETHER$|^2-(METHOXY|ETHOXY|PROPOXY|BUTOXY|HEXYLOXY)ETHANOL$"}
  - {name: "Lead compounds", pattern: "\\bLEAD\\b"}
  - {name: "Manganese compounds", pattern: "MANGAN|\\bMANEB\\b|\\bMANCOZEB\\b"}
  - {name: "Mercury compounds", pattern: "MERCUR"}
  - {name: "Nickel compounds", pattern: "NICKEL"}
  - {name: "Selenium compounds", pattern: "SELEN"}
