# California's toxic air contaminants (TACs): what import_carbtac tags
# Chemical.Category.TOXIC_AIR_CONTAMINANT from, and nothing else does.
#
# CARB's list is two sections of Title 17, CCR:
#   93000  the 21 substances CARB identified itself (benzene, formaldehyde,
#          hexavalent chromium, diesel PM, ...)
#   93001  the 189 federal hazardous air pollutants (Clean Air Act 112(b)),
#          all designated TACs in 1993
# Every 93000 substance a pesticide could carry is also in 93001, so the
# lists below are 93001's. Its names come from CARB's page; its CAS numbers
# from EPA's HAP list, matched by name (CARB lists names only). EPA has since
# added 1-bromopropane and removed caprolactam, MEK and others; CARB's 93001
# hasn't followed, so neither does this.
#
# CARB's health-values table (contable.pdf) is NOT this list: it gives
# health values for many substances that aren't TACs (ammonia, sulfur
# dioxide, sulfuric acid, ...).
#
# Sources (checked 2026-10-15):
#   https://ww2.arb.ca.gov/resources/documents/carb-identified-toxic-air-contaminants
#   https://www.epa.gov/haps/initial-list-hazardous-air-pollutants-modifications

