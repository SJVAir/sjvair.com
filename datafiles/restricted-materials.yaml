# California restricted materials — 3 CCR 6400(e).
#
# The regulation names active ingredients; CDPR's PUR chemical table names
# them differently and splits several into their salts and esters, so each
# entry lists the PUR chemical names it covers. Every name below was
# verified to exist in the imported chemical table.
#
# Source: California Code of Regulations, Title 3, section 6400(e).
# CDPR publishes no machine-readable list (its restricted materials page
# links no file), which is why this is curated here rather than imported.
