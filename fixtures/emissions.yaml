# Toxic pollutants: weights follow ToxicPollutant.set_weights() (iur × mwaf ×
# 7700; 0.01712 / chronic REL; 0.1712 / acute REL). Ammonia is a precursor
# and carries no weights; isopropyl alcohol has no OEHHA values.
#
# Natural pks 1-4: 0008_copy_named_toxics only creates a placeholder for a
# NAMED_TOXICS column that has at least one non-null value, so a fresh
# (empty) EmissionsRecord table -- as here -- gets none, leaving these free.
- model: emissions.toxicpollutant
  pk: 1
  fields:
    carb_id: "71432"
    cas_number: 71-43-2
    name: Benzene
    slug: benzene
    kind: toxic
    iur: 2.9e-05
    chronic_rel: 3.0
    acute_rel: 27.0
    mwaf: 1.0
    weighted: true
    cancer_weight: 0.2233
    chronic_weight: 0.005706666666666667
    acute_weight: 0.006340740740740741
    health_values_date: 2024-12-17
- model: emissions.toxicpollutant
  pk: 2
