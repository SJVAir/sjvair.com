{% load humanize %}
<table>
    <caption>Outdoor monitors inside</caption>
    <tr><th>Total</th><td>{{ counts.total|intcomma }}</td></tr>
    <tr><th>Active (last hour)</th><td>{{ counts.active|intcomma }}</td></tr>
    <tr><th>Inactive</th><td>{{ counts.inactive|intcomma }}</td></tr>
    <tr><th>Hidden</th><td>{{ counts.hidden|intcomma }}</td></tr>
    <tr><th>SJVAir-owned</th><td>{{ counts.sjvair|intcomma }}</td></tr>
</table>
