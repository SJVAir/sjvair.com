<div class="section-map-wrap">
  <div class="section-map" id="section-map-{{ map_config.year }}"
       data-sections-url="{{ map_config.sections_url }}"
       data-counties-url="{{ map_config.counties_url }}"
       data-townships-url="{{ map_config.townships_url }}"
       data-notices-url="{{ map_config.notices_url }}"
       data-section-url-pattern="{{ map_config.section_url_pattern }}"
       data-section-page-url="{{ map_config.section_page_url }}"
       data-chemical-page-url="{{ map_config.chemical_page_url }}"
       data-product-page-url="{{ map_config.product_page_url }}"
       data-notice-page-url="{{ map_config.notice_page_url }}"
       data-tiles="{{ map_config.tile_url }}"
       data-attribution="{{ map_config.attribution }}"
       data-year="{{ map_config.year }}"
       data-chemical="{{ map_config.chemical }}"
       data-product="{{ map_config.product }}"
       data-commodity="{{ map_config.commodity }}"
       data-county="{{ map_config.county }}"
       data-highlight="{{ map_config.highlight }}"
       data-outline-url="{{ map_config.outline_url }}"
       data-center="{{ map_config.center }}"
       data-zoom="{{ map_config.zoom }}"
       data-radius="{{ map_config.radius }}"
       data-show-notices="{{ map_config.show_notices }}"></div>
  {# Controls and legend sit over the map (top-right, bottom-left), so they stay usable when the map is expanded. #}
  <div class="section-map-panel section-map-controls" data-panel="options" hidden>
    <div class="section-map-panel-head">
      <button type="button" class="section-map-panel-toggle" aria-expanded="true" aria-controls="section-map-options-{{ map_config.year }}">
        <span class="fa-duotone fa-fw fa-gear section-map-panel-icon is-options" aria-hidden="true"></span>
        <span class="section-map-panel-title">Options</span>
        <span class="fa-regular fa-fw fa-chevron-up section-map-panel-chevron" aria-hidden="true"></span>
      </button>
    </div>
    <div class="section-map-panel-body" id="section-map-options-{{ map_config.year }}">
      <div class="section-map-metric" role="group" aria-label="Shade by">
        <label><input type="radio" name="metric" value="lbs_chemical" checked> Pounds</label>
        <label><input type="radio" name="metric" value="applications"> Applications</label>
      </div>
      <label class="section-map-notices-toggle"><input type="checkbox" name="notices"{% if map_config.show_notices == '1' %} checked{% endif %}> Show notices</label>
      <label class="section-map-sections-toggle"><input type="checkbox" name="sections"> All sections</label>
      <button type="button" class="section-map-expand" aria-pressed="false" title="Expand the map">
        <span class="fa-regular fa-fw fa-expand" aria-hidden="true"></span><span class="section-map-expand-label">Expand</span>
      </button>
      <span class="section-map-status" aria-live="polite"></span>
    </div>
  </div>
  <div class="section-map-panel section-map-legend-panel" data-panel="legend" hidden>
    <div class="section-map-panel-head">
      <button type="button" class="section-map-panel-toggle" aria-expanded="true" aria-controls="section-map-legend-{{ map_config.year }}">
        <span class="fa-duotone fa-fw fa-circle-info section-map-panel-icon is-legend" aria-hidden="true"></span>
        <span class="section-map-panel-title">Legend</span>
        <span class="fa-regular fa-fw fa-chevron-up section-map-panel-chevron" aria-hidden="true"></span>
      </button>
    </div>
    <div class="section-map-panel-body" id="section-map-legend-{{ map_config.year }}">
      <ul class="county-legend section-map-legend"></ul>
      <span class="section-map-level"></span>
      {% if map_config.note %}<p class="section-map-note">{{ map_config.note }}</p>{% endif %}
    </div>
  </div>
  <noscript>{% if county_map %}{% include 'pesticides/includes/county-map.html' %}{% endif %}</noscript>
</div>
