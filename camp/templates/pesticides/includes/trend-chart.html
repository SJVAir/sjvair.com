{% load pesticides_explorer %}
{% if has_data %}
{% if heading %}<h2 class="title is-4">{{ heading }}</h2>{% endif %}
<figure class="explorer-chart trend-chart">
    <h3 class="chart-title">{{ title }}</h3>
    {# The hovered year and value; charts.js writes here as the cursor moves. #}
    <p class="chart-readout" aria-live="polite"></p>
    <div class="chart-canvas" data-chart="{{ chart_id }}" role="img"
         aria-label="{{ title }}, {{ first_year }} to {{ last_year }}{% if sentence %}. {{ sentence }}{% endif %}"></div>
    {{ chart|json_script:chart_id }}
    {% with table=chart|chart_table %}
    {% if table %}
    {# The chart is a picture, so its numbers are here for a screen reader (the heatmap does the same). #}
    <div class="is-sr-only">
    <table>
        <caption>{{ title }}</caption>
        <thead><tr><th scope="col">Year</th>{% for column in table.columns %}<th scope="col">{{ column }}</th>{% endfor %}</tr></thead>
        <tbody>
        {% for x, values in table.rows %}<tr><th scope="row">{{ x }}</th>{% for value in values %}<td>{% if value is None %}—{% else %}{{ value|lbs }}{% endif %}</td>{% endfor %}</tr>{% endfor %}
        </tbody>
    </table>
    </div>
    {% endif %}
    {% endwith %}
    {% if legend %}
        {# A stacked chart's series, in stack order (emissions sector_stack_chart); charts.js fills each one's share for the hovered year. #}
        <p class="chart-legend is-series">{% for item in legend %}<span><span class="chart-key is-swatch" style="background: {{ item.color }}"></span>{{ item.label }}<strong class="chart-legend-share" data-share="{{ forloop.counter0 }}"></strong></span>{% endfor %}</p>
    {% endif %}
    {% if compare_label %}
        <p class="chart-legend">
            <span class="chart-key is-line"></span>{{ compare_label }}
        </p>
    {% endif %}
    {% if sentence %}<figcaption class="trend-delta">{{ sentence }}</figcaption>{% endif %}
    {% if note %}<p class="chart-note is-size-7 has-text-grey">{% if note_url %}<a href="{{ note_url }}">{{ note }}</a>{% else %}{{ note }}{% endif %}</p>{% endif %}
</figure>
{% endif %}
