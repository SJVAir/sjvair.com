{% load pesticides_explorer %}
{% with max_lbs=by_month|max_lbs %}
<div class="month-bars">
    {% for month in by_month %}
    {# The amount shows above the bar on hover (and on focus, for keyboards); the aria-label carries it otherwise. #}
    <div class="bar" tabindex="0" aria-label="{{ month.month|month_name }}{% if year_label %} {{ year_label }}{% endif %}: {{ month.lbs|lbs }} lbs">
        <span class="amount" aria-hidden="true">{{ month.lbs|lbs }} lbs</span>
        <span class="fill" style="height: {% if max_lbs %}{% widthratio month.lbs max_lbs 100 %}{% else %}0{% endif %}%"></span>
        <span class="label">{{ month.month|month_abbr }}</span>
    </div>
    {% endfor %}
</div>
{% endwith %}
