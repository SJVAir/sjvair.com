{% load pesticides_explorer %}
<div class="table-container">
<table class="table is-fullwidth is-narrow is-striped by-year-table">
    <thead><tr><th>Year</th><th class="has-text-right">Lbs</th><th class="has-text-right">Acres treated</th><th class="has-text-right">Applications</th></tr></thead>
    <tbody>
    {% for row in by_year %}
        <tr{% if row.year == year %} class="is-selected"{% endif %}>
            <td><a href="{% qs_replace year=row.year page=None %}">{{ row.year }}</a></td>
            <td class="has-text-right">{{ row.lbs|lbs }}</td>
            <td class="has-text-right">{{ row.acres|lbs }}</td>
            <td class="has-text-right">{{ row.applications|lbs }}</td>
        </tr>
    {% endfor %}
    </tbody>
</table>
</div>
